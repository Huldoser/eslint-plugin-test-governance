name: Release

# Merging a release pull request (see prepare-release.yml) changes the version in package.json on
# main. This workflow then publishes that version to npm through trusted publishing, with provenance,
# tags the merge commit and creates the GitHub release with the version's CHANGELOG.md section as its
# notes. Pushing a tag such as v0.2.1 by hand does the same for the tagged commit. Running the
# workflow by hand with an existing tag only creates that tag's GitHub release.
# npm's trusted publisher is bound to this file's name, so publishing has to stay here.

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a GitHub release for, e.g. v0.1.0 (nothing is published to npm)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Find the version to release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      release: ${{ steps.find.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # package.json also changes for dependency updates; only a new version is released.
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Checks and packs the release without the npm publishing token, so no dependency or build script
  # ever runs where it could publish.
  build:
    name: Check and pack
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check the tag is on main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # never restore a cache in a release build
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
      - name: Check the changelog has an entry for this version and nothing unreleased
        run: |
          node scripts/changelog-section.mjs "$TAG" > /dev/null
          if node scripts/changelog-section.mjs Unreleased > /dev/null 2>&1; then
            echo "::error::CHANGELOG.md has entries under [Unreleased], so $TAG would ship changes its notes leave out. Tag the commit that released them, or move them into the version's section."
            exit 1
          fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:pack
      - name: Check the plugin reports the same version
        run: |
          node --input-type=module -e "
            import plugin from './dist/index.js';
            const expected = process.env.TAG.slice(1);
            if (plugin.meta.version !== expected) {
              console.error('::error::meta.version is ' + plugin.meta.version + ', expected ' + expected);
              process.exit(1);
            }"
      - name: Pack
        run: |
          mkdir pack
          npm pack --pack-destination pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      # No checkout and no install: this job only publishes the tarball the build job checked.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore a cache in a release build
      # Trusted publishing needs a newer npm than Node ships with.
      - run: npm install -g npm@11.21.0
      - name: Publish
        run: |
          # A re-run after a later step failed must not try to publish the same version again.
          if npm view "eslint-plugin-test-governance@${TAG#v}" version > /dev/null 2>&1; then
            echo "${TAG#v} is already on npm."
          else
            # The ./ makes npm read the path as a file; `pack/x.tgz` is taken for a GitHub owner/repo.
            npm publish ./pack/eslint-plugin-test-governance-"${TAG#v}".tgz --provenance --access public
          fi

  github-release:
    name: Create GitHub release
    needs: [version, publish]
    # On a push, only after the version is published; when run by hand, on its own.
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.version.outputs.tag }}
    steps:
      # The changelog on the checked-out branch or tag also holds the entries of older versions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/changelog-section.mjs "$TAG" > notes.md
      # A release from main has no tag yet. A tag pushed with this workflow's token doesn't start
      # this workflow again.
      - name: Tag the released commit
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
