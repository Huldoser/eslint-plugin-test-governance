name: Prepare release

# Run by hand to start a release. Bumps the version, moves the [Unreleased] changelog entries into a
# section for it, pushes a release/vx.y.z branch and prints a link that opens the "Release x.y.z" pull
# request. The workflow token can't open pull requests, so the maintainer opens it from that link, and
# CI runs on it like on any other pull request. Merging it publishes the version (see release.yml).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version such as 0.3.0
        required: true
        default: patch

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch
    steps:
      # The token stays out of .git/config while `npm ci` runs install scripts; the push step below hands
      # it to git through gh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bump the version and the changelog
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(node scripts/prepare-release.mjs "$BUMP")" >> "$GITHUB_OUTPUT"
      - run: npm run format:check
      - name: Push the release branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Release $VERSION"
          gh auth setup-git
          git push origin "$branch"
      - name: Print the link that opens the release pull request
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "Merging this publishes $VERSION to npm with provenance, tags the merge commit v$VERSION and creates the GitHub release with these notes:"
            echo
            node scripts/changelog-section.mjs "$VERSION"
          } > body.md
          url=$(node -e '
            const { readFileSync } = require("node:fs");
            const { GITHUB_SERVER_URL, GITHUB_REPOSITORY, VERSION } = process.env;
            const title = encodeURIComponent(`Release ${VERSION}`);
            const body = encodeURIComponent(readFileSync("body.md", "utf8"));
            console.log(`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...release/v${VERSION}?expand=1&title=${title}&body=${body}`);
          ')
          echo "Open the release pull request: $url"
          {
            echo "[Open the Release $VERSION pull request]($url)"
            echo
            echo "If the link doesn't fill in the description, paste this:"
            echo
            echo '```markdown'
            cat body.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
