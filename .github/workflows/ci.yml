name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new ESLint, parser, TypeScript or Node release that breaks the plugin shows up without a
  # pull request. The jobs install the latest version in each supported range.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} / ESLint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        eslint: [9, 10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint }} # zizmor: ignore[adhoc-packages] the ESLint major under test
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:pack -- --eslint ${{ matrix.eslint }}

  # The oldest versions package.json accepts: Node 22.12 (engines) and ESLint 9.0.0 (peer range).
  # ESLint 9.0 ships no types, so this job runs the tests only; the jobs above cover types and packing.
  oldest:
    name: Node 22.12 / ESLint 9.0.0 (oldest supported)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@9.0.0 # zizmor: ignore[adhoc-packages] the oldest ESLint the peer range allows
      # Node 22.12 runs the TypeScript tests only with type stripping turned on; later versions have it on by default.
      - run: npm test
        env:
          NODE_OPTIONS: --experimental-strip-types --no-warnings=ExperimentalWarning

  # Paths, process spawning and packing on Windows. The jobs above cover the version range, so one job on the
  # LTS Node and the latest ESLint is enough here.
  windows:
    name: Windows / Node 24 / ESLint 10
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:pack

  # The type declarations as consumers resolve them. The package is ESM only, so a CommonJS `require` from
  # TypeScript's node16 mode is expected to need a dynamic import.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only # zizmor: ignore[adhoc-packages] a pinned checker, not a dependency

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:check

  # actionlint checks the workflow syntax and the shell in each step; zizmor checks them for security problems.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false

  # The one check the main branch ruleset requires, so jobs can be added or renamed without changing the
  # ruleset. It runs after every other job, even when one fails, and passes only when all of them passed.
  ci:
    needs: [test, oldest, windows, types, lint, docs, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
