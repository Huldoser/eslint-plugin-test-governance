name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by prepare-release.yml for the release pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ESLint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        eslint: [9, 10]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint }}
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:pack -- --eslint ${{ matrix.eslint }}

  # The oldest versions package.json accepts: Node 22.12 (engines) and ESLint 9.0.0 (peer range).
  # ESLint 9.0 ships no types, so this job runs the tests only; the jobs above cover types and packing.
  oldest:
    name: Node 22.12 / ESLint 9.0.0 (oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@9.0.0
      # Node 22.12 runs the TypeScript tests only with type stripping turned on; later versions have it on by default.
      - run: npm test
        env:
          NODE_OPTIONS: --experimental-strip-types --no-warnings=ExperimentalWarning

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:check
